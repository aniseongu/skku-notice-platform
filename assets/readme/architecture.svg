<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">성공 시스템 아키텍처</title>
  <desc id="d">공지 출처에서 OCI 서버의 타이머가 수집하고, Supabase에 저장하며, 웹앱과 웹 푸시로 사용자에게 전달하는 흐름</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8eef2"/>
    </marker>
    <style>
      .bg { fill: #1f3a33; }
      .col { fill: none; stroke: #e8eef2; stroke-width: 2; }
      .card { fill: #2a4a41; stroke: #7fa89c; stroke-width: 1.2; }
      .hl { fill: #35584d; stroke: #b6d6cb; stroke-width: 1.4; }
      .h { fill: #e8eef2; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .t { fill: #ffffff; font-size: 17px; font-weight: 600; }
      .s { fill: #c9ddd5; font-size: 14px; }
      .n { fill: #a9c7bc; font-size: 13px; }
      .ln { stroke: #e8eef2; stroke-width: 2; fill: none; }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="720" rx="20"/>

  <!-- 1. 공지 출처 -->
  <text class="h" x="145" y="52">공지 출처</text>
  <rect class="col" x="40" y="72" width="210" height="450" rx="22"/>
  <rect class="card" x="58" y="92" width="174" height="92" rx="12"/>
  <text class="t" x="72" y="122">성균관대 공지</text>
  <text class="s" x="72" y="146">단과대·학과 게시판</text>
  <text class="s" x="72" y="166">60여 개</text>
  <rect class="card" x="58" y="198" width="174" height="76" rx="12"/>
  <text class="t" x="72" y="228">부트캠프 사업단</text>
  <text class="s" x="72" y="252">공지 · 소식</text>
  <rect class="card" x="58" y="288" width="174" height="108" rx="12"/>
  <text class="t" x="72" y="318">외부 인턴 공고</text>
  <text class="s" x="72" y="342">링커리어</text>
  <text class="s" x="72" y="362">자소설닷컴</text>
  <text class="s" x="72" y="382">학생인재개발팀</text>
  <rect class="card" x="58" y="410" width="174" height="92" rx="12"/>
  <text class="t" x="72" y="440">아이캠퍼스</text>
  <text class="s" x="72" y="464">사용자의 토큰으로</text>
  <text class="s" x="72" y="484">과제·퀴즈 마감</text>

  <!-- 2. 서버 -->
  <text class="h" x="455" y="52">수집·처리 (OCI 무료 서버)</text>
  <rect class="col" x="300" y="72" width="310" height="450" rx="22"/>
  <text class="n" x="455" y="98" text-anchor="middle">Python · systemd 타이머 (권한을 나눈 사용자로 실행)</text>
  <rect class="hl" x="320" y="112" width="270" height="62" rx="12"/>
  <text class="t" x="336" y="138">수집 · 30분마다</text>
  <text class="s" x="336" y="160">새 글, 수정, 본문, 첨부 이미지</text>
  <rect class="card" x="320" y="186" width="270" height="62" rx="12"/>
  <text class="t" x="336" y="212">OCR</text>
  <text class="s" x="336" y="234">RapidOCR(한국어)로 이미지 속 글자</text>
  <rect class="card" x="320" y="260" width="270" height="62" rx="12"/>
  <text class="t" x="336" y="286">Gemini 판정</text>
  <text class="s" x="336" y="308">사용자 키로 나에게 맞는 공지인지</text>
  <rect class="card" x="320" y="334" width="270" height="62" rx="12"/>
  <text class="t" x="336" y="360">아이캠퍼스 확인</text>
  <text class="s" x="336" y="382">마감 알림을 대기열에 넣기</text>
  <rect class="hl" x="320" y="408" width="270" height="62" rx="12"/>
  <text class="t" x="336" y="434">푸시 발송</text>
  <text class="s" x="336" y="456">웹 푸시(VAPID), 키워드·판정 규칙</text>
  <text class="n" x="455" y="500" text-anchor="middle">비밀 키는 각 워커의 환경에만 있어요</text>

  <!-- 3. Supabase -->
  <text class="h" x="775" y="52">Supabase</text>
  <rect class="col" x="650" y="72" width="250" height="450" rx="22"/>
  <rect class="hl" x="668" y="92" width="214" height="150" rx="12"/>
  <text class="t" x="682" y="122">PostgreSQL</text>
  <text class="s" x="682" y="146">공지, 구독, 키워드,</text>
  <text class="s" x="682" y="166">저장·읽음, 프로필</text>
  <text class="s" x="682" y="190">행 수준 보안(RLS)으로</text>
  <text class="s" x="682" y="210">사용자 간 접근 차단</text>
  <rect class="card" x="668" y="256" width="214" height="80" rx="12"/>
  <text class="t" x="682" y="286">Auth</text>
  <text class="s" x="682" y="310">Google 로그인</text>
  <rect class="card" x="668" y="350" width="214" height="152" rx="12"/>
  <text class="t" x="682" y="380">Edge Function</text>
  <text class="s" x="682" y="404">Gemini 키와 아이캠퍼스</text>
  <text class="s" x="682" y="424">토큰을 확인하고 암호화해</text>
  <text class="s" x="682" y="444">저장해요. 브라우저는</text>
  <text class="s" x="682" y="464">암호문을 읽을 수 없어요</text>

  <!-- 4. 사용자 -->
  <text class="h" x="1055" y="52">사용자</text>
  <rect class="col" x="950" y="72" width="210" height="450" rx="22"/>
  <rect class="hl" x="968" y="92" width="174" height="170" rx="12"/>
  <text class="t" x="982" y="122">웹앱 (PWA)</text>
  <text class="s" x="982" y="146">React · Vite</text>
  <text class="s" x="982" y="166">Cloudflare Pages</text>
  <text class="s" x="982" y="196">공지 보기, 설정,</text>
  <text class="s" x="982" y="216">키·토큰 입력</text>
  <rect class="card" x="968" y="290" width="174" height="120" rx="12"/>
  <text class="t" x="982" y="320">내 기기</text>
  <text class="s" x="982" y="344">휴대폰 · PC 알림</text>
  <text class="s" x="982" y="364">서비스 워커가</text>
  <text class="s" x="982" y="384">알림을 띄워요</text>

  <!-- 화살표 -->
  <line class="ln" x1="250" y1="190" x2="298" y2="190" marker-end="url(#a)"/>
  <line class="ln" x1="610" y1="143" x2="648" y2="143" marker-end="url(#a)"/>
  <line class="ln" x1="900" y1="160" x2="948" y2="160" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln dash" d="M455 522 L455 600 L1055 600 L1055 412" marker-end="url(#a)"/>
  <text class="s" x="755" y="590" text-anchor="middle">푸시 알림 (웹 푸시)</text>

  <text class="n" x="40" y="660">30분마다 타이머가 깨어나 새 공지를 가져와요 · GitHub Actions는 CI에만 써요</text>
  <text class="n" x="40" y="684">로그인한 사용자의 구독, 키워드, 키, 토큰은 계정별로 격리해요</text>
</svg>
