[project]
name = "skku-notice-alert"
version = "0.1.0"
description = "성균관대 공지 게시판을 읽어 내 기준에 맞는 글만 알림으로 보낸다"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apprise>=2.1.0",
    "cryptography>=50.0.2",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "nh3==0.3.7",
    "onnxruntime>=1.31.1",
    "python-dotenv>=1.2.4",
    "pywebpush>=2.5.0",
    "pyyaml>=6.0.3",
    "rapidocr==3.10.0",
    "requests>=2.34.2",
    "selectolax>=1.0.2",
]

[project.scripts]
skku-notice = "skku_notice.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skku_notice"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
