<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>성공</title>
  <meta name="application-name" content="성공">
  <meta name="apple-mobile-web-app-title" content="성공">
  <meta name="description" content="성균관대 공지와 인턴 공고를 한곳에서 보고 새 소식과 마감 알림을 받아요">
  <!-- 설치 앱의 상태 표시줄과 제목 표시줄 색. --bg 토큰과 같은 값(docs/design/platforms.md). -->
  <meta name="theme-color" content="#f3f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d100f" media="(prefers-color-scheme: dark)">
  <!-- favicon.svg는 안에서 스스로 다크로 바뀐다. PNG는 다크 파일을 따로 두고 media로 고른다(scripts/build_icons.py). -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-48.png" type="image/png" sizes="48x48" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icon-48-dark.png" type="image/png" sizes="48x48" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">

</head>
